name: phold
channels:
    - conda-forge
    - bioconda
    - defaults
dependencies:
    - python==3.9.21
    - pip
    - genbank_to
    - foldseek  # binary tool; pip install of phold does not include it
    - pip:
        - --extra-index-url https://download.pytorch.org/whl/cu124
        - torch==2.6.0+cu124
        - phold>=1.2.5
